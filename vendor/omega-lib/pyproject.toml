[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-lib"
version = "0.1.0"
description = "Bibliotheque partagee OMEGA-SUITE (noyau minimal : ConfidenceLevel + shared/) — voir ~/DEV/SUITE/DECISIONS_ARCHITECTURE.md D-005"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omega_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
